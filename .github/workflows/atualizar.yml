name: Postador TechCrunch Automático

on:
  workflow_dispatch:
  schedule:
    - cron: '27 12,15,18,21 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar o Robo do WordPress
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python bot.py

      - name: Salvar historico de postagens
        run: |
          git config --global user.name 'Bot Internacional'
          git config --global user.email 'bot@email.com'
          git add state_wp_intl.json || true
          git commit -m "🤖 Atualizado historico de links postados [skip ci]" || true
          git push || true
