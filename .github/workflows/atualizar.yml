name: Postador TechCrunch Automático

on:
  workflow_dispatch: # Permite que você aperte um botão para rodar manualmente
  schedule:
    - cron: '27 12,15,18,21 * * *' # Roda em horários alternados para pegar novidades

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:        # 👈 ADICIONE ESTA LINHA
      contents: write   # 👈 ADICIONE ESTA LINHA
    steps:
      - name: Baixar o código do repositório
...
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar o Robô do WordPress
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python bot.py
        - name: Salvar histórico de postagens
        run: |
          git config --global user.name 'Bot Internacional'
          git config --global user.email 'bot@email.com'
          git add state_wp_intl.json || true
          git commit -m "🤖 Atualizado histórico de links postados [skip ci]" || true
          git push || true
